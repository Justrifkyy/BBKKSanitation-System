name: arjuna_mobile
description: "ARJUNA - Aplikasi Skrining dan Pemeriksaan Sanitasi Transportasi"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # Camera & Media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  image: ^4.3.0
  pdf: ^3.11.1
  permission_handler: ^11.3.1

  # Digital Signature
  signature: ^5.5.0
  file_picker: 8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_bbkk.png
    - assets/images/logo_arjuna.png
